[package]
name = "codebook-tree-sitter-typst-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
codebook-tree-sitter-typst = { path = ".." }
libfuzzer-sys = "0.4"
tree-sitter = "0.25.10"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "seeds"
path = "seeds.rs"
test = false
doc = false
bench = false

# Keeps this crate out of any workspace above it.
[workspace]
